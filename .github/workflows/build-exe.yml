name: Build Windows EXE

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/01a10462-d
    paths:
      - 'steam-hours-viewer/**'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: steam-hours-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SteamHoursViewer --icon=assets/app.ico app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamHoursViewer-windows-exe
          path: steam-hours-viewer/dist/SteamHoursViewer.exe
