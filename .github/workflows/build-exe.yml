name: Build Windows EXE

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: steam-hours-viewer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SteamHoursViewer --icon=assets/app.ico app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamHoursViewer-windows-exe
          path: steam-hours-viewer/dist/SteamHoursViewer.exe
      - name: Commit exe back to repo
        shell: bash
        run: |
          mkdir -p release
          cp dist/SteamHoursViewer.exe release/SteamHoursViewer.exe
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add steam-hours-viewer/release/SteamHoursViewer.exe
          git commit -m "[skip ci] Release build: SteamHoursViewer.exe" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
